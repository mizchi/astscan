name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: astscan-release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5
      - name: Verify the tag and prepare release notes
        id: check
        run: node tools/release.mjs "$GITHUB_REF_NAME" "$RUNNER_TEMP/astscan-release-notes.md" --registry
      - name: Verify both crate archives
        run: cargo package --locked -p astscan-core -p astscan
      - name: Authenticate with crates.io
        if: steps.check.outputs.publish_core == 'true' || steps.check.outputs.publish_cli == 'true'
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish astscan-core
        if: steps.check.outputs.publish_core == 'true'
        run: cargo publish --locked -p astscan-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
      - name: Publish astscan
        if: steps.check.outputs.publish_cli == 'true'
        run: cargo publish --locked -p astscan
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            exit 0
          fi
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/astscan-release-notes.md" "${prerelease[@]}"
