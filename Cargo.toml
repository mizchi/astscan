[package]
name = "astscan"
version = "0.1.0"
edition = "2024"
description = "Fast multi-rule structural code search, compatible with ast-grep rule files (extraction only)"
license = "MIT"

[dependencies]
# The grammars and their versions are the ones ast-grep 0.45.3 was built
# with: the same parser is what makes the same rule match the same nodes.
tree-sitter = "=0.27.0"
tree-sitter-bash = "=0.25.1"
tree-sitter-c = "=0.24.2"
tree-sitter-c-sharp = "=0.23.5"
tree-sitter-cpp = "=0.23.4"
tree-sitter-css = "=0.25.0"
tree-sitter-dart = "=0.2.0"
tree-sitter-elixir = "=0.3.5"
tree-sitter-go = "=0.25.0"
tree-sitter-haskell = "=0.23.1"
tree-sitter-hcl = "=1.1.0"
tree-sitter-html = "=0.23.2"
tree-sitter-java = "=0.23.5"
tree-sitter-javascript = "=0.25.0"
tree-sitter-json = "=0.24.8"
tree-sitter-kotlin = { version = "=0.4.1", package = "tree-sitter-kotlin-sg" }
tree-sitter-lua = "=0.5.0"
tree-sitter-md = "=0.5.3"
tree-sitter-nix = "=0.3.0"
tree-sitter-php = "=0.24.2"
tree-sitter-python = "=0.25.0"
tree-sitter-ruby = "=0.23.1"
tree-sitter-rust = "=0.24.2"
tree-sitter-scala = "=0.26.2"
tree-sitter-solidity = "=1.2.13"
tree-sitter-swift = "=0.7.3"
tree-sitter-typescript = "=0.23.2"
tree-sitter-yaml = "=0.7.2"
serde = "1"
serde_yaml = "0.9"
serde_json = "1"
regex = "1"
memmap2 = "0.9"
zstd = { version = "0.13", default-features = false }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
memchr = "2"
ignore = "0.4"
libloading = "0.8"
itoa = "1"
simdutf8 = "0.1"
mimalloc = { version = "0.1", default-features = false }
libmimalloc-sys = { version = "0.1", default-features = false }

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1

[dev-dependencies]
# Dictionary training, for the storage experiments in examples/.
zstd = { version = "0.13", default-features = false, features = ["zdict_builder"] }
