[package]
name = "astscan"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Fast multi-rule structural code search, compatible with ast-grep rule files (extraction only)"
license = "MIT"
repository = "https://github.com/mizchi/astscan"
include = ["/src/**", "/tests/**", "/README.md", "/LICENSE"]

[workspace]
members = ["crates/astscan-core", "experiments"]
default-members = [".", "crates/astscan-core"]
resolver = "3"

[dependencies]
astscan-core = { path = "crates/astscan-core", version = "0.1.0", features = ["internals"] }
tree-sitter = "=0.27.0"
memmap2 = "0.9"
zstd = { version = "0.13", default-features = false }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
memchr = "2"
ignore = "0.4"
itoa = "1"
simdutf8 = "0.1"
mimalloc = { version = "0.1", default-features = false }
libmimalloc-sys = { version = "0.1", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1

[dev-dependencies]
serde_json = "1"
